<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Chat | Kevin Snorf</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #111613;
            --bg-card: #19221d;
            --accent: #C5A059;
            --text-main: #F0F4F1;
            --text-muted: #9BA8A2;
            --border: #26332c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.7; padding-top: 70px; }
        
        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: rgba(17, 22, 19, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
            align-items: center; padding: 18px 30px; z-index: 1000;
        }
        .nav-brand { font-weight: 700; font-size: 1.1rem; color: var(--text-main); text-decoration: none; }
        .nav-brand span { color: var(--accent); }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        
        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 15px; }
        h1 span { color: var(--accent); }
        
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 40px 20px; margin-top: 30px; }
        .card p { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 15px; }
        .email-link { font-size: 1.3rem; color: var(--accent); text-decoration: none; font-weight: 700; }
        .email-link:hover { text-decoration: underline; }
        
        footer { background-color: #0b0f0d; border-top: 1px solid var(--border); padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 60px; }
    </style>
</head>
<body>
    <nav>
        <a href="../" class="nav-brand">Kevin <span>Snorf</span></a>
        <ul class="nav-links">
            <li><a href="../">Home</a></li>
            <li><a href="../about/">About</a></li>
            <li><a href="./" class="active">Contact</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Let's <span>Chat</span></h1>
        <p>Let's chat to find out if we'd work well together. The first call is on me.</p>
        
        <div class="card">
            <p>Get in touch directly via email:</p>
            <a href="mailto:emailthesnorf@gmail.com" class="email-link">emailthesnorf@gmail.com</a>
        </div>
    </div>
    <footer>
        <p>© 2026 Kevin Snorf. All rights reserved.</p>
    </footer>
</body>
</html>
